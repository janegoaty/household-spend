<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spending">
<title>Spending Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #F7F4EF;
    --card: #FFFFFF;
    --ink: #1A1A1A;
    --muted: #888;
    --accent: #2E4057;
    --accent-light: #E8EDF3;
    --success: #2D6A4F;
    --success-light: #D8F3DC;
    --danger: #C0392B;
    --border: #E5E0D8;
    --radius: 16px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 40px;
  }

  header {
    width: 100%;
    background: var(--accent);
    padding: 52px 24px 24px;
    text-align: center;
  }
  header h1 {
    font-family: 'DM Serif Display', serif;
    color: #fff;
    font-size: 26px;
    font-weight: 400;
    letter-spacing: 0.01em;
  }
  header p {
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    margin-top: 4px;
    letter-spacing: 0.02em;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 28px 24px;
    width: calc(100% - 32px);
    max-width: 420px;
    margin-top: -16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.07);
  }

  .field { margin-bottom: 20px; }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  input, select {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    color: var(--ink);
    background: #FAFAF8;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    appearance: none;
  }
  input:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
    background: #fff;
  }

  .select-wrap { position: relative; }
  .select-wrap::after {
    content: '▾';
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
    font-size: 14px;
  }

  .amount-wrap { position: relative; }
  .amount-wrap span {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 16px;
    font-weight: 500;
  }
  .amount-wrap input { padding-left: 40px; }

  .who-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .who-btn {
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--muted);
    background: #FAFAF8;
    cursor: pointer;
    transition: all 0.15s;
  }
  .who-btn.active {
    border-color: var(--accent);
    background: var(--accent-light);
    color: var(--accent);
  }

  .submit-btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 17px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.15s, transform 0.1s;
    letter-spacing: 0.02em;
  }
  .submit-btn:active { transform: scale(0.98); opacity: 0.9; }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--success);
    color: #fff;
    padding: 14px 24px;
    border-radius: 50px;
    font-size: 15px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    white-space: nowrap;
    pointer-events: none;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.error { background: var(--danger); }

  /* Setup screen */
  .setup-screen {
    background: var(--card);
    border-radius: var(--radius);
    padding: 28px 24px;
    width: calc(100% - 32px);
    max-width: 420px;
    margin-top: -16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.07);
  }
  .setup-screen h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .setup-screen p {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 20px;
  }
  .setup-screen input {
    margin-bottom: 12px;
  }
  .setup-btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 15px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  .date-chip {
    display: inline-block;
    background: var(--accent-light);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    padding: 5px 12px;
    border-radius: 50px;
    margin-bottom: 24px;
  }
</style>
</head>
<body>

<header>
  <h1>Household Spending</h1>
  <p id="headerDate"></p>
</header>

<div id="mainForm" class="card" style="display:none">
  <div class="date-chip" id="dateChip"></div>

  <div class="field">
    <label>What / Where</label>
    <input type="text" id="description" placeholder="e.g. FairPrice, Zara Kids…" autocomplete="off" />
  </div>

  <div class="field">
    <label>Amount (SGD)</label>
    <div class="amount-wrap">
      <span>$</span>
      <input type="number" id="amount" placeholder="0.00" step="0.01" min="0" inputmode="decimal" />
    </div>
  </div>

  <div class="field">
    <label>Credit Card</label>
    <input type="text" id="card" placeholder="e.g. DBS, pink card…" autocomplete="off" />
  </div>

  <div class="field">
    <label>Entered By</label>
    <div class="who-row">
      <button class="who-btn active" id="btn-me" onclick="setWho('Me')">👩 Me</button>
      <button class="who-btn" id="btn-helper" onclick="setWho('Helper')">🧹 Helper</button>
    </div>
  </div>

  <button class="submit-btn" id="submitBtn" onclick="submitEntry()">Log Spending</button>
</div>

<div class="toast" id="toast"></div>

<script>
    let selectedWho = 'Me';

  function init() {
    const now = new Date();
    document.getElementById('headerDate').textContent = now.toLocaleDateString('en-SG', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    document.getElementById('dateChip').textContent = now.toLocaleDateString('en-SG', { day:'numeric', month:'short', year:'numeric' });
    document.getElementById('mainForm').style.display = 'block';
  }
  function setWho(who) {
    selectedWho = who;
    document.getElementById('btn-me').classList.toggle('active', who === 'Me');
    document.getElementById('btn-helper').classList.toggle('active', who === 'Helper');
  }

  async function submitEntry() {
    const desc = document.getElementById('description').value.trim();
    const amount = document.getElementById('amount').value.trim();
    const card = document.getElementById('card').value;

    if (!desc || !amount || !card) {
      showToast('Please fill in all fields', true); return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    const now = new Date();
    const date = now.toLocaleDateString('en-SG', { day:'2-digit', month:'2-digit', year:'numeric' });
    const month = now.toLocaleDateString('en-SG', { month:'short', year:'numeric' }); // e.g. "May 2026"

    const payload = { date, description: desc, amount: parseFloat(amount), card, enteredBy: selectedWho, month };

    try {
      const scriptUrl = 'https://script.google.com/macros/s/AKfycbzTROo6mEZixl_I-XT3WQcrEBy9lgj9D3niCkR1RLFZldI7ZfZSA63eEpDKawmCignJ/exec';
      await fetch(scriptUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      showToast('✓ Saved!');
      document.getElementById('description').value = '';
      document.getElementById('amount').value = '';
      document.getElementById('card').value = '';
      setWho('Me');
    } catch (e) {
      showToast('Error — check your connection', true);
    }

    btn.disabled = false;
    btn.textContent = 'Log Spending';
  }

  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '') + ' show';
    setTimeout(() => t.className = 'toast' + (isError ? ' error' : ''), 2500);
  }

  init();
</script>
</body>
</html>
